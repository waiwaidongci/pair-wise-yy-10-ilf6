<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>漆线雕返修解锁台</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 20px 28px 14px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 25px; }
    h2 { margin: 0; font-size: 17px; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    .sub, .meta { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    main { padding: 18px 28px 34px; display: grid; gap: 16px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 60px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 36px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .head-actions { display: flex; gap: 10px; align-items: end; }
    .head-actions label { min-width: 150px; }
    .top { display: grid; grid-template-columns: 350px 1fr; gap: 16px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel > h2 { margin-bottom: 12px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; }
    .mini h3 { font-size: 13.5px; margin-bottom: 8px; }
    .mini-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 12.5px; }
    .mini-row.low b { color: var(--red); }
    .slot-no { color: var(--teal); font-weight: 700; }
    .boards { display: grid; gap: 16px; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(185px, 1fr)); gap: 12px; overflow-x: auto; }
    .board.rework { grid-template-columns: repeat(3, minmax(230px, 1fr)); }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 220px; }
    .col h3 { display: flex; justify-content: space-between; }
    .item, .ticket { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; scroll-margin-top: 90px; }
    .item.overdue { border-left-color: var(--red); }
    .ticket.accepted { border-left-color: var(--violet); }
    .ticket.repairing { border-left-color: var(--teal); }
    .ticket.review { border-left-color: var(--amber); }
    .ticket-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .ticket-id { color: var(--violet); font-size: 12px; font-weight: 700; }
    .defects { margin: 6px 0; font-size: 12.5px; display: grid; gap: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 80px; font-size: 12px; padding: 7px 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 2px; }
    .tag { display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 9px; background: #e7eeea; color: var(--muted); white-space: nowrap; }
    .tag.danger { background: #f5e1e1; color: var(--red); }
    .tag.warn { background: #f7ecd3; color: var(--amber); }
    .tag.ok { background: #dcebe6; color: var(--teal); }
    .tag.violet { background: #e6e3f1; color: var(--violet); }
    .defect-text { color: var(--red); }
    .plan-box { border: 1px dashed var(--amber); background: #fdf7e9; border-radius: 6px; padding: 7px 9px; font-size: 12px; color: #6d501b; margin: 6px 0; line-height: 1.55; }
    .check { display: flex; grid-template-columns: none; gap: 8px; align-items: center; font-size: 13px; color: var(--ink); margin: 4px 0; }
    .check input { width: auto; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(560px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; }
    .dialog-body h2 { margin: 0; }
    .logs { border-top: 1px dashed var(--line); padding-top: 7px; max-height: 150px; overflow-y: auto; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .hist { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px dotted var(--line); font-size: 12.5px; flex-wrap: wrap; }
    .flash-bar { position: fixed; top: -70px; left: 50%; transform: translateX(-50%); z-index: 99; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; box-shadow: 0 4px 18px rgba(0,0,0,0.18); transition: top 0.25s ease; max-width: calc(100vw - 40px); }
    .flash-bar.show { top: 12px; }
    .flash-bar.ok { background: #e2efe9; color: #175746; border: 1px solid #b7d6c9; }
    .flash-bar.warn { background: #fbf1d9; color: #6d501b; border: 1px solid #e4cd94; }
    .flash-bar.error { background: #f7e1e1; color: var(--red); border: 1px solid #ddb2b3; }
    .flash { animation: pulse 0.9s ease-in-out 2; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(102, 92, 147, 0.45); } }
    @media (max-width: 1020px) {
      header { display: block; padding: 16px; }
      .head-actions { margin-top: 10px; }
      main { padding: 14px; }
      .top, .lists, .toolbar { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="flash" class="flash-bar"></div>

  <header>
    <div>
      <h1>漆线雕返修解锁台</h1>
      <div class="sub">断线/翘线返修受理 · 线材批次占位 · 阴干位顺序 · 复核解锁</div>
    </div>
    <div class="head-actions">
      <label>当前操作师傅<select id="artisanSelect"></select></label>
      <button id="exportBtn" class="secondary">导出 JSON</button>
    </div>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option selected>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
        </div>
        <div class="grid2">
          <label>阴干日期<input name="dryDate" type="date" required></label>
          <label>交付日期<input name="delivery" type="date" required></label>
        </div>
        <div class="grid2">
          <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
          <label>当前状态<select name="status"><option selected>贴线中</option><option>待阴干</option><option>上金粉</option><option>待交付</option></select></label>
        </div>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入解锁台</button>
      </form>

      <section class="panel">
        <h2>今日工位与占用</h2>
        <div class="lists">
          <div class="mini">
            <h3>阴干位顺序</h3>
            <div id="miniSlots"></div>
          </div>
          <div class="mini">
            <h3>返修单概览</h3>
            <div id="miniRework"></div>
          </div>
          <div class="mini">
            <h3>线材批次余量</h3>
            <div id="miniBatches"></div>
          </div>
        </div>
        <form id="batchForm" class="grid2" style="margin-top:10px">
          <label>新批次名称<input name="batchName" required placeholder="朱红漆线·丁批"></label>
          <label>线规<select name="batchLine"><option>细线</option><option selected>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>总量（米）<input name="batchTotal" type="number" min="1" value="50"></label>
          <button type="submit" class="secondary">登记批次</button>
        </form>
      </section>
    </section>

    <section class="panel">
      <h2>返修单流转</h2>
      <div id="reworkBoard" class="board rework"></div>
      <h3 style="margin-top:14px">已结案（复核通过 / 胎体纹样修正失效）</h3>
      <div id="historyList"></div>
    </section>

    <section class="panel">
      <h2>作品看板</h2>
      <div class="toolbar">
        <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
        <label>状态筛选<select id="statusFilter"></select></label>
        <label>排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
        <button id="clearFilters" class="secondary">清空</button>
      </div>
      <div id="board" class="board"></div>
    </section>
  </main>

  <!-- 登记缺陷 -->
  <dialog id="defectDialog">
    <div class="dialog-body">
      <h2 id="defectDialogTitle">登记缺陷</h2>
      <label>缺陷类型<select id="defectType"><option>断线</option><option>翘线</option></select></label>
      <label>缺陷位置<input id="defectLocation" placeholder="右下花瓣断线处"></label>
      <div class="meta">登记后冻结该作品新领料；已占用线材批次维持占位。缺陷可挂到已受理返修单。</div>
      <div class="actions">
        <button id="saveDefect" class="warn">登记缺陷</button>
        <button class="secondary" onclick="this.closest('dialog').close()">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 领料 -->
  <dialog id="reqDialog">
    <div class="dialog-body">
      <h2 id="reqTitle">领料</h2>
      <label>线材批次<select id="reqBatch"></select></label>
      <label>数量（米）<input id="reqQty" type="number" min="1" value="5"></label>
      <div class="meta">存在未结案断线/翘线缺陷时新领料被冻结；返修中已占批次不受影响。</div>
      <div class="actions">
        <button id="confirmReq">确认领料</button>
        <button class="secondary" onclick="this.closest('dialog').close()">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 胎体/纹样修正 -->
  <dialog id="editDialog">
    <div class="dialog-body">
      <h2 id="editTitle">胎体/纹样修正</h2>
      <label>胎体材质<input id="editBase"></label>
      <label>纹样主题<input id="editTheme"></label>
      <div id="editWarn" class="meta" style="color:var(--red)"></div>
      <div class="actions">
        <button id="saveEdit" class="violet">保存修正</button>
        <button class="secondary" onclick="this.closest('dialog').close()">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 进度回退方案 -->
  <dialog id="rollbackDialog">
    <div class="dialog-body">
      <h2>返修进度回退</h2>
      <div id="rbWorkInfo" class="meta"></div>
      <label>回退后进度（%）<input id="rbProgress" type="number" min="0" max="100"></label>
      <div>误占批次（复核通过后才释放）：<div id="rbBatches" style="margin-top:6px"></div></div>
      <label class="check" id="rbSlotWrap"><input type="checkbox" id="rbSlot">同步申请重排阴干位（复核通过后移至队尾）</label>
      <div class="meta">方案仅登记：复核前批次维持占位、阴干位不动、进度不落定；驳回则全部恢复。</div>
      <div class="actions">
        <button id="confirmRollback" class="warn">登记回退方案</button>
        <button class="secondary" onclick="this.closest('dialog').close()">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 作品详情 -->
  <dialog id="detailDialog">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailContent" class="meta" style="display:grid;gap:6px"></div>
      <div class="actions">
        <button class="secondary" onclick="this.closest('dialog').close()">关闭</button>
      </div>
    </div>
  </dialog>

  <script src="occupation-ledger.js"></script>
  <script src="rework-judge.js"></script>
  <script src="page-state.js"></script>
</body>
</html>
